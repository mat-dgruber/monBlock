name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  node-ci:
    name: Node.js Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      # Scripts do instalador rodam como root: qualquer aviso do shellcheck quebra o build.
      - run: shellcheck packaging/macos/scripts/preinstall packaging/macos/scripts/postinstall packaging/macos/uninstall.sh scripts/*.sh tests/e2e/root/run.sh

  macos-package:
    name: macOS — .pkg do monblockd e E2E como root
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Sem segredos de assinatura aqui: assinatura ad-hoc. Release assina com Developer ID (MONBLOCK_CODESIGN_ID / MONBLOCK_INSTALLER_ID).
      # O node do setup-node tem só a fatia do runner; o binário universal sai de um node universal (instalador do nodejs.org).
      - run: npm run build:pkg
      - run: |
          plutil -lint packaging/macos/com.ccat.monblockd.plist
          codesign --verify --strict build/daemon/monblockd
          pkgutil --payload-files build/monblockd.pkg | grep -q 'PrivilegedHelperTools/com.ccat.monblockd/monblockd$'
      # Runner descartável com sudo sem senha: instala o .pkg de verdade (spec §13/§14).
      # O sudo troca o PATH; o node do setup-node precisa ser repassado.
      - name: E2E root
        run: sudo env "PATH=$PATH" sh tests/e2e/root/run.sh
      - name: Log do daemon
        if: failure()
        run: sudo tail -100 /var/log/monblockd.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: monblockd-pkg
          path: build/monblockd.pkg
          retention-days: 7
      # .app com o .pkg embutido: o botão "Reinstalar serviço" abre Contents/Resources/monblockd.pkg.
      - run: npm run build:app
      - run: |
          test -f build/monBlock.app/Contents/Resources/monblockd.pkg
          codesign --verify --deep --strict build/monBlock.app
          plutil -extract CFBundleIdentifier raw build/monBlock.app/Contents/Info.plist | grep -qx com.ccat.monblock
      - name: Smoke do .app (10 s sem crash)
        run: |
          build/monBlock.app/Contents/MacOS/Electron --user-data-dir="$RUNNER_TEMP/monblock-smoke" &
          PID=$!
          sleep 10
          kill -0 "$PID"
          kill "$PID"
      - run: ditto -c -k --keepParent build/monBlock.app build/monBlock-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: monBlock-app
          path: build/monBlock-app.zip
          retention-days: 7
